<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓍢ִ໋🌷͙֒  | Рай Цветов </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <header>
      <div class="logo">🌸 Рай цветов</div>
      <nav>
        <a href="#catalog">Каталог</a>
        <a href="#about">О нас</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Свежие цветы с доставкой</h1>
      <p>Порадуйте близких красивым букетом уже сегодня!</p>
      <button id="showPhoneButton">Показать телефон</button>
      <p id="phoneNumber" class="hidden">+7 (999) 228-67-42</p>
    </section>

    <section id="catalog" class="catalog">
      <h2>Наши букеты</h2>
      <div class="cards">
                    <div class="card">
                <h3>Букет «Нежность»</h3>
                <p>Розы, пионы, эустома</p>
                <span class="price">2 500 ₽</span>
            </div>
            <div class="card">
                <h3>Букет «Страсть»</h3>
                <p>Красные розы, герберы</p>
                <span class="price">3 200 ₽</span>
            </div>
            <div class="card">
                <h3>Букет «Весна»</h3>
                <p>Тюльпаны, ирисы, зелень</p>
                <span class="price">1 800 ₽</span>
            </div>
      </div>
    </section>
    
  </body>
